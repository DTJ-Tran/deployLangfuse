name: Deploy DuckDNS to GCP VM

on:
  workflow_dispatch:

jobs:
  deploy-duckdns:
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy DuckDNS
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no davestran@${{ secrets.GCP_VM_HOST }} << 'ENDSSH'
            mkdir -p ~/scripts
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/deploy-duckdns.sh -o ~/scripts/deploy-duckdns.sh
            chmod +x ~/scripts/deploy-duckdns.sh

            export DUCKDNS_SUBDOMAIN="${{ vars.DUCKDNS_SUBDOMAIN }}"
            export DUCKDNS_TOKEN="${{ secrets.DUCKDNS_TOKEN }}"

            bash ~/scripts/deploy-duckdns.sh
          ENDSSH
