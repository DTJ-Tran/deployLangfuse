name: "1. Deploy ClickHouse"

on:
  workflow_dispatch:

jobs:
  deploy-clickhouse:
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy ClickHouse
        timeout-minutes: 10
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          CLICKHOUSE_USER: ${{ vars.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: |
          cat > /tmp/remote-deploy.sh << EOF
          set -euxo pipefail
          mkdir -p ~/scripts
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/deploy-clickhouse.sh -o ~/scripts/deploy-clickhouse.sh
          chmod +x ~/scripts/deploy-clickhouse.sh
          export CLICKHOUSE_USER="$CLICKHOUSE_USER"
          export CLICKHOUSE_PASSWORD="$CLICKHOUSE_PASSWORD"
          bash ~/scripts/deploy-clickhouse.sh
          EOF
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no davestran@$VM_HOST 'bash -s' < /tmp/remote-deploy.sh
