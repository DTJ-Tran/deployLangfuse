name: "3. Deploy Langfuse Web (v3.227)"

on:
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy Langfuse Web UI
        timeout-minutes: 15
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          SALT: ${{ secrets.SALT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          REDIS_AUTH: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY }}
          REDIS_HOST: ${{ vars.UPSTASH_REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          CLICKHOUSE_USER: ${{ vars.CLICKHOUSE_USER }}
          LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${{ vars.LANGFUSE_S3_EVENT_UPLOAD_BUCKET }}
          LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${{ vars.LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT }}
          LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${{ vars.LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID }}
        run: |
          cat > /tmp/remote-deploy.sh << EOF
          set -euxo pipefail
          mkdir -p ~/scripts
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/deploy-web.sh -o ~/scripts/deploy-web.sh
          chmod +x ~/scripts/deploy-web.sh
          export DATABASE_URL="$DATABASE_URL"
          export NEXTAUTH_URL="http://$VM_HOST:3000"
          export NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
          export SALT="$SALT"
          export ENCRYPTION_KEY="$ENCRYPTION_KEY"
          export LANGFUSE_HOSTNAME="0.0.0.0"
          export LANGFUSE_PORT="3000"
          export REDIS_HOST="$REDIS_HOST"
          export REDIS_PORT="$REDIS_PORT"
          export REDIS_AUTH="$REDIS_AUTH"
          export CLICKHOUSE_USER="$CLICKHOUSE_USER"
          export CLICKHOUSE_PASSWORD="$CLICKHOUSE_PASSWORD"
          export LANGFUSE_S3_EVENT_UPLOAD_BUCKET="$LANGFUSE_S3_EVENT_UPLOAD_BUCKET"
          export LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT="$LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT"
          export LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID="$LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID"
          export LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY="$LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY"
          bash ~/scripts/deploy-web.sh
          EOF
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no davestran@$VM_HOST 'bash -s' < /tmp/remote-deploy.sh
