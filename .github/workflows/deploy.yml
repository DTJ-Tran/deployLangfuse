name: Deploy Langfuse to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deploy script to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: davestran
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: scripts/deploy-langfuse.sh
          target: ~/

      - name: Deploy Langfuse (ClickHouse + Web + Worker)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: davestran
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export NEXTAUTH_URL="http://${{ secrets.GCP_VM_HOST }}:3000"
            export NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
            export SALT="${{ secrets.SALT }}"
            export ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}"
            export REDIS_HOST="${{ vars.UPSTASH_REDIS_HOST }}"
            export REDIS_PORT="${{ vars.REDIS_PORT }}"
            export REDIS_AUTH="${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"
            export CLICKHOUSE_USER="${{ vars.CLICKHOUSE_USER }}"
            export CLICKHOUSE_PASSWORD="${{ secrets.CLICKHOUSE_PASSWORD }}"
            export LANGFUSE_S3_EVENT_UPLOAD_BUCKET="${{ vars.LANGFUSE_S3_EVENT_UPLOAD_BUCKET }}"
            export LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT="${{ vars.LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT }}"
            export LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID="${{ vars.LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID }}"
            export LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY="${{ secrets.LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY }}"
            bash ~/scripts/deploy-langfuse.sh
