name: Deploy Phoenix to Cloud Run

on:
  workflow_dispatch:

jobs:
  build:
    name: Build image (Modal + Kaniko)
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Build & push Phoenix image
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          modal token set \
            --token-id ${{ env.MODAL_TOKEN_ID }} \
            --token-secret ${{ env.MODAL_TOKEN_SECRET }}
          modal run scripts/build-phoenix-image.py \
            --registry us-central1-docker.pkg.dev \
            --image-name ${{ secrets.GCP_PROJECT_ID }}/phoenix/phoenix \
            --tag latest \
            --platform linux/amd64 \
            --push

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: langfuse_dep
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Phoenix
        timeout-minutes: 10
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PHOENIX_SERVICE_NAME: ${{ vars.PHOENIX_SERVICE_NAME }}
          PHOENIX_SECRET: ${{ secrets.PHOENIX_SECRET }}
          PHOENIX_SQL_DATABASE_URL: ${{ secrets.PHOENIX_SQL_DATABASE_URL }}
          PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${{ secrets.PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD }}
        run: bash scripts/deploy-phoenix.sh
