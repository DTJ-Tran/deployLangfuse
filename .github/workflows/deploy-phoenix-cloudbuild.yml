name: Deploy Phoenix to Cloud Run (Cloud Build)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build image (Cloud Build + Kaniko)
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push Phoenix image
        run: |
          gcloud builds submit . \
            --config=cloudbuild.yaml \
            --region=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --substitutions=TAG_NAME=latest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: langfuse_dep
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Phoenix
        timeout-minutes: 15
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          PHOENIX_SERVICE_NAME: ${{ vars.PHOENIX_SERVICE_NAME }}
          PHOENIX_SECRET: ${{ secrets.PHOENIX_SECRET }}
          PHOENIX_SQL_DATABASE_URL: ${{ secrets.PHOENIX_SQL_DATABASE_URL }}
          PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${{ secrets.PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD }}
        run: bash scripts/deploy-phoenix.sh
