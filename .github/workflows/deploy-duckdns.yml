name: Deploy DuckDNS to GCP VM

on:
  workflow_dispatch:

jobs:
  deploy-duckdns:
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy DuckDNS
        timeout-minutes: 5
        run: |
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no davestran@${{ secrets.GCP_VM_HOST }} \
              DUCKDNS_SUBDOMAIN="${{ vars.DUCKDNS_SUBDOMAIN }}" \
              DUCKDNS_TOKEN="${{ secrets.DUCKDNS_TOKEN }}" \
              GH_REPO="${{ github.repository }}" \
              bash -s << 'ENDSSH'
            set -euo pipefail
            mkdir -p ~/scripts
            curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/${GH_REPO}/main/scripts/deploy-duckdns.sh?nocache=$(date +%s)" -o ~/scripts/deploy-duckdns.sh
            chmod +x ~/scripts/deploy-duckdns.sh
            bash ~/scripts/deploy-duckdns.sh
          ENDSSH
