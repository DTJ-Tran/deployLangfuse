name: "Deploy Langfuse Web (v2.24.1)"

on:
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: langfuse_dep

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy Langfuse Web UI
        timeout-minutes: 15
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          SALT: ${{ secrets.SALT }}
        run: |
          cat > /tmp/remote-deploy.sh << EOF
          set -euxo pipefail
          mkdir -p ~/scripts
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/deploy-web.sh -o ~/scripts/deploy-web.sh
          chmod +x ~/scripts/deploy-web.sh
          export DATABASE_URL="$DATABASE_URL"
          export NEXTAUTH_URL="http://$VM_HOST:3000"
          export NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
          export SALT="$SALT"
          export LANGFUSE_HOSTNAME="0.0.0.0"
          export LANGFUSE_PORT="3000"
          bash ~/scripts/deploy-web.sh
          EOF
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no davestran@$VM_HOST 'bash -s' < /tmp/remote-deploy.sh
